type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - photo
properties:
  _id:
    type: string
    description: Contact id
    example: 67eec4c00c73bfc979baedbc
  name:
    type: string
    description: Contact name
    example: Lola Bs
  phoneNumber:
    type: string
    description: Contact number
    example: +38097357689
  email:
    type: string
    format: email
    description: Contact email
    example: Ryann60@yahoo.com
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite
    example: false
  contactType:
    type: string
    description: Contact type
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    type: string
    description: Contact id
    example: 67eec4c00c73bfc979baedbc
  photo:
    type: string
    description: Student avatar url
    example: https://res.cloudinary.com/dha4xvgfi/image/upload/v1743104601/snunhxlqvnd67budfeja.webp
  createdAt:
    type: string
    format: date-time
    description: Student created date
    example: 2025-03-27T19:43:21.686+00:00
  updateAt:
    type: string
    format: date-time
    description: Student updated date
    example: 2025-03-27T19:43:21.686+00:00
  __v:
    type: integer
    description: Mongoose version key
    example: 0
