tags:
  - Contact
summary: Create contact
operationId: createContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: Lola Bs
          phoneNumber:
            type: string
            description: Contact number
            example: +38097357689
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: personal
          photo:
            type: string
            format: binary
            description: Contact photo file
            default: null
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: ../../components/schemas/ContactUpdateRequest.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
