tags:
  - Contact
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
          - createdAt
          - updateAt
          - photo
        properties:
          _id:
            type: string
            description: Contact id
            example: 67eec4c00c73bfc979baedbc
          name:
            type: string
            description: Contact name
            example: Lola Bs
          phoneNumber:
            type: string
            description: Contact number
            example: +38097357689
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: personal
          userId:
            type: string
            description: Contact id
            example: 67eec4c00c73bfc979baedbc
          createdAt:
            type: string
            format: date-time
            description: Student created date
            example: 2025-03-27T19:43:21.686+00:00
          updateAt:
            type: string
            format: date-time
            description: Student updated date
            example: 2025-03-27T19:43:21.686+00:00
          photo:
            type: string
            format: binary
            description: Contact photo file
            default: null
responses:
  '201':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
